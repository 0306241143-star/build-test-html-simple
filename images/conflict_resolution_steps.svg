<!-- Infographic năm bước xử lý bất đồng; tên file SVG theo snake_case. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">5 bước trao đổi khi bất đồng</title>
  <desc id="desc">Dừng lại, nhận diện cảm xúc, nói điều mình cần, lắng nghe nhau và cùng chọn giải pháp.</desc>
  <rect width="760" height="300" rx="4" fill="#e8eee5"/>
  <text x="36" y="42" fill="#176b61" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">BẤT ĐỒNG KHÔNG CÓ NGHĨA LÀ ĐỐI ĐẦU</text>
  <text x="36" y="78" fill="#172a2a" font-family="Arial, sans-serif" font-size="25" font-weight="700">5 bước để cùng tìm tiếng nói chung</text>
  <path d="M105 153H652" fill="none" stroke="#9bb9a7" stroke-width="2" stroke-dasharray="4 7"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(42 118)">
      <circle cx="31" cy="34" r="29" fill="#176b61"/><text x="31" y="39" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">01</text>
      <text x="31" y="91" fill="#172a2a" font-size="12" font-weight="700" text-anchor="middle">DỪNG LẠI</text>
      <text x="31" y="111" fill="#596962" font-size="10" text-anchor="middle">Chưa cần trả lời</text>
      <text x="31" y="126" fill="#596962" font-size="10" text-anchor="middle">ngay lập tức</text>
    </g>
    <g transform="translate(180 118)">
      <circle cx="31" cy="34" r="29" fill="#d48b6c"/><text x="31" y="39" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">02</text>
      <text x="31" y="91" fill="#172a2a" font-size="12" font-weight="700" text-anchor="middle">NHẬN DIỆN</text>
      <text x="31" y="111" fill="#596962" font-size="10" text-anchor="middle">Mình đang cảm</text>
      <text x="31" y="126" fill="#596962" font-size="10" text-anchor="middle">thấy thế nào?</text>
    </g>
    <g transform="translate(318 118)">
      <circle cx="31" cy="34" r="29" fill="#176b61"/><text x="31" y="39" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">03</text>
      <text x="31" y="91" fill="#172a2a" font-size="12" font-weight="700" text-anchor="middle">NÓI ĐIỀU CẦN</text>
      <text x="31" y="111" fill="#596962" font-size="10" text-anchor="middle">Tập trung vào sự</text>
      <text x="31" y="126" fill="#596962" font-size="10" text-anchor="middle">việc, không quy kết</text>
    </g>
    <g transform="translate(456 118)">
      <circle cx="31" cy="34" r="29" fill="#d48b6c"/><text x="31" y="39" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">04</text>
      <text x="31" y="91" fill="#172a2a" font-size="12" font-weight="700" text-anchor="middle">LẮNG NGHE</text>
      <text x="31" y="111" fill="#596962" font-size="10" text-anchor="middle">Tìm hiểu góc nhìn</text>
      <text x="31" y="126" fill="#596962" font-size="10" text-anchor="middle">của người kia</text>
    </g>
    <g transform="translate(594 118)">
      <circle cx="31" cy="34" r="29" fill="#176b61"/><text x="31" y="39" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">05</text>
      <text x="31" y="91" fill="#172a2a" font-size="12" font-weight="700" text-anchor="middle">CÙNG CHỌN</text>
      <text x="31" y="111" fill="#596962" font-size="10" text-anchor="middle">Thống nhất bước</text>
      <text x="31" y="126" fill="#596962" font-size="10" text-anchor="middle">tiếp theo phù hợp</text>
    </g>
  </g>
  <text x="36" y="275" fill="#176b61" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">TẠM DỪNG · HIỂU NHAU · CÙNG GIẢI QUYẾT</text>
</svg>
