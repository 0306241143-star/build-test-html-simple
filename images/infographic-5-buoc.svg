<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000"><rect width="1700" height="1000" fill="#f3fafc"/><text x="850" y="115" font-family="DejaVu Sans" font-size="64" font-weight="700" fill="#153653" text-anchor="middle">5 BƯỚC TRAO ĐỔI KHI BẤT ĐỒNG</text><text x="850" y="169" font-family="DejaVu Sans" font-size="29" fill="#587087" text-anchor="middle">Từ lắng nghe đến giải pháp cùng thực hiện</text><g font-family="DejaVu Sans"><rect x="64" y="295" width="310" height="390" rx="42" fill="#d9f1ee"/><circle cx="219" cy="360" r="52" fill="white"/><text x="219" y="382" text-anchor="middle" font-size="60" fill="#193956" font-weight="700">1</text><text x="219" y="483" font-size="28" font-weight="700" fill="#183d55" text-anchor="middle">TẠM DỪNG</text><text x="219" y="544" font-size="22" fill="#32576b" text-anchor="middle">Bình tĩnh,</text><text x="219" y="586" font-size="22" fill="#32576b" text-anchor="middle">chậm phản ứng</text><rect x="398" y="295" width="310" height="390" rx="42" fill="#e7ebfe"/><circle cx="553" cy="360" r="52" fill="white"/><text x="553" y="382" text-anchor="middle" font-size="60" fill="#193956" font-weight="700">2</text><text x="553" y="483" font-size="28" font-weight="700" fill="#183d55" text-anchor="middle">LẮNG NGHE</text><text x="553" y="544" font-size="22" fill="#32576b" text-anchor="middle">Không ngắt lời,</text><text x="553" y="586" font-size="22" fill="#32576b" text-anchor="middle">hỏi để hiểu</text><rect x="732" y="295" width="310" height="390" rx="42" fill="#ffeadf"/><circle cx="887" cy="360" r="52" fill="white"/><text x="887" y="382" text-anchor="middle" font-size="60" fill="#193956" font-weight="700">3</text><text x="887" y="483" font-size="28" font-weight="700" fill="#183d55" text-anchor="middle">NÓI NHU CẦU</text><text x="887" y="544" font-size="22" fill="#32576b" text-anchor="middle">Dùng câu “Tôi”,</text><text x="887" y="586" font-size="22" fill="#32576b" text-anchor="middle">không đổ lỗi</text><rect x="1066" y="295" width="310" height="390" rx="42" fill="#fff1c9"/><circle cx="1221" cy="360" r="52" fill="white"/><text x="1221" y="382" text-anchor="middle" font-size="60" fill="#193956" font-weight="700">4</text><text x="1221" y="483" font-size="28" font-weight="700" fill="#183d55" text-anchor="middle">TÌM PHƯƠNG ÁN</text><text x="1221" y="544" font-size="22" fill="#32576b" text-anchor="middle">Đề xuất ít nhất</text><text x="1221" y="586" font-size="22" fill="#32576b" text-anchor="middle">hai lựa chọn</text><rect x="1400" y="295" width="310" height="390" rx="42" fill="#dff3dd"/><circle cx="1555" cy="360" r="52" fill="white"/><text x="1555" y="382" text-anchor="middle" font-size="60" fill="#193956" font-weight="700">5</text><text x="1555" y="483" font-size="28" font-weight="700" fill="#183d55" text-anchor="middle">THỐNG NHẤT</text><text x="1555" y="544" font-size="22" fill="#32576b" text-anchor="middle">Chọn cách làm</text><text x="1555" y="586" font-size="22" fill="#32576b" text-anchor="middle">và hẹn xem lại</text></g><rect x="164" y="775" width="1372" height="112" rx="43" fill="#dfeef4"/><text x="850" y="846" font-family="DejaVu Sans" text-anchor="middle" font-size="32" fill="#1b526c">Mục tiêu là cùng hiểu và hợp tác, không phải giành phần thắng.</text><text x="850" y="949" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#567083">Tư liệu thiết kế cho website Quản lý cảm xúc và xử lý xung đột</text></svg>