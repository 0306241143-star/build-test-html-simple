<!-- Banner nhận diện dự án tự thiết kế; tên file SVG theo snake_case. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Lắng nghe để hiểu</title>
  <desc id="desc">Banner dự án với thông điệp Dừng lại để hiểu cảm xúc, lắng nghe để cùng giải quyết.</desc>
  <rect width="900" height="420" fill="#123d39"/>
  <circle cx="720" cy="210" r="170" fill="none" stroke="#4d8271" stroke-width="2"/>
  <circle cx="720" cy="210" r="128" fill="none" stroke="#4d8271" stroke-width="2" opacity=".65"/>
  <rect x="615" y="116" width="190" height="188" transform="rotate(-5 710 210)" fill="#e3eedf"/>
  <text x="650" y="179" fill="#176b61" font-family="Arial,sans-serif" font-size="53" font-weight="700">“</text>
  <text x="650" y="220" fill="#172a2a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Lắng nghe</text>
  <text x="650" y="249" fill="#172a2a" font-family="Arial,sans-serif" font-size="22" font-weight="700">để hiểu</text>
  <text x="58" y="104" fill="#b9d9c9" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">QUẢN LÝ CẢM XÚC · XỬ LÝ XUNG ĐỘT</text>
  <text x="58" y="184" fill="#ffffff" font-family="Arial,sans-serif" font-size="49" font-weight="700">Dừng lại để hiểu.</text>
  <text x="58" y="245" fill="#a9d6bd" font-family="Arial,sans-serif" font-size="49" font-weight="700">Lắng nghe để kết nối.</text>
  <text x="58" y="309" fill="#d3e2d9" font-family="Arial,sans-serif" font-size="17">Nhận diện cảm xúc · Chọn phản hồi · Cùng tìm giải pháp</text>
  <text x="58" y="370" fill="#e79678" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">LẮNG NGHE ĐỂ HIỂU</text>
</svg>
